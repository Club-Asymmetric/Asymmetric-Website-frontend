        <img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&w=1280&q=85" alt="Pixel-art pink and violet lily" crossorigin="anonymous">
      </div>
      <div class="flower__layer flower__layer--top" id="flowerTop" aria-hidden="true">
        <img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_151324_bf318a5f-5525-4fc7-aab5-e9a341018828.png&w=1280&q=85" alt="" crossorigin="anonymous">
      </div>
    </div>

    <div class="corner-copy corner-copy--left">
      <span class="support-copy__inner">Every workflow,<br>intelligently connected.</span>
    </div>
    <div class="corner-copy corner-copy--right">
      <span class="support-copy__inner">Less manual work.<br>More meaningful output.</span>
    </div>

    <div class="mobile-chrome">
      <button class="burger" id="burgerBtn" aria-label="Open menu" aria-expanded="false" aria-controls="mobileSheet">
        <span></span>
      </button>
      <div class="scrim" id="scrim"></div>
      <nav class="sheet" id="mobileSheet" inert>
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#resources">Resources</a></li>
          <li><a href="#benefits">Benefits</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>

  </section>
</main>

<script>
(function(){
  "use strict";

  /* ---------- Entrance: remove .anim once ---------- */
  var root=document.documentElement;
  var finished=false;
  function endAnim(){
    if(finished)return;
    finished=true;
    root.classList.remove("anim");
  }
  var pieces=document.querySelectorAll(".orbit-word__inner,.flower,.support-copy__inner");
  var remaining=pieces.length;
  if(remaining===0){endAnim();}
  pieces.forEach(function(el){
    el.addEventListener("animationend",function(){
      remaining--;
      if(remaining<=0)endAnim();
    },{once:true});
  });
  setTimeout(endAnim,6000);

  /* ---------- Mobile menu ---------- */
  var burgerBtn=document.getElementById("burgerBtn");
  var scrim=document.getElementById("scrim");
  var sheet=document.getElementById("mobileSheet");
  var body=document.body;
  var focusables=[];

  function openMenu(){
    body.classList.add("menu-open");
    sheet.removeAttribute("inert");
    burgerBtn.setAttribute("aria-expanded","true");
    focusables=Array.prototype.slice.call(sheet.querySelectorAll("a,button"));
    if(focusables[0])focusables[0].focus();
    document.addEventListener("keydown",onKeydown);
  }
  function closeMenu(){
    body.classList.remove("menu-open");
    sheet.setAttribute("inert","");
    burgerBtn.setAttribute("aria-expanded","false");
    burgerBtn.focus();
    document.removeEventListener("keydown",onKeydown);
  }
  function onKeydown(e){
    if(e.key==="Escape"){closeMenu();return;}
    if(e.key==="Tab"&&focusables.length){
      var first=focusables[0],last=focusables[focusables.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  }
  if(burgerBtn){
    sheet.setAttribute("inert","");
    burgerBtn.addEventListener("click",function(){
      body.classList.contains("menu-open")?closeMenu():openMenu();
    });
    scrim.addEventListener("click",closeMenu);
  }

  /* ---------- Morph trail ---------- */
  var TRAIL_MAX_POINTS=60;
  var TRAIL_HEAD_R=140;
  var TRAIL_NOISE_AMP=44;
  var TRAIL_BLOB_PTS=24;
  var TRAIL_FADE_SPEED=0.92;
  var TRAIL_SAMPLE_DIST=8;

  function drawMorphBlob(ctx,cx,cy,r,t,seed){
    if(r<2)return;
    var pts=[];
    for(var i=0;i<TRAIL_BLOB_PTS;i++){
      var angle=(i/TRAIL_BLOB_PTS)*Math.PI*2;
      var n1=Math.sin(angle*3+t*1.4+seed)*0.45;
      var n2=Math.sin(angle*5-t*0.9+seed*2.3)*0.3;
      var n3=Math.cos(angle*2+t*1.8+seed*0.7)*0.25;
      var noise=(n1+n2+n3)*TRAIL_NOISE_AMP*(r/TRAIL_HEAD_R);
      var rr=r+noise;
      pts.push([cx+Math.cos(angle)*rr, cy+Math.sin(angle)*rr]);
    }
    ctx.beginPath();
    var len=pts.length;
    var start=[(pts[0][0]+pts[len-1][0])/2,(pts[0][1]+pts[len-1][1])/2];
    ctx.moveTo(start[0],start[1]);
    for(var j=0;j<len;j++){
      var p1=pts[j];
      var p2=pts[(j+1)%len];
      var mid=[(p1[0]+p2[0])/2,(p1[1]+p2[1])/2];
      ctx.quadraticCurveTo(p1[0],p1[1],mid[0],mid[1]);
    }
    ctx.closePath();
    ctx.fill();
  }

  function MorphTrailLayer(hostImg,invert){
    this.img=hostImg;
    this.invert=invert;
    this.canvas=document.createElement("canvas");
    this.canvas.style.display="none";
    this.ctx=this.canvas.getContext("2d");
    document.body.appendChild(this.canvas);
  }
  MorphTrailLayer.prototype.resize=function(w,h){
    this.canvas.width=Math.max(1,Math.round(w));
    this.canvas.height=Math.max(1,Math.round(h));
  };
  MorphTrailLayer.prototype.render=function(points,time){
    var ctx=this.ctx,w=this.canvas.width,h=this.canvas.height;
    ctx.clearRect(0,0,w,h);
    if(!this.invert){
      ctx.globalCompositeOperation="source-over";
      ctx.fillStyle="#fff";
      ctx.fillRect(0,0,w,h);
      ctx.globalCompositeOperation="destination-out";
    }else{
      ctx.globalCompositeOperation="source-over";
      ctx.fillStyle="#fff";
    }
    for(var i=0;i<points.length;i++){
      var p=points[i];
      ctx.globalAlpha=p.alpha;
      drawMorphBlob(ctx,p.x,p.y,p.r,time,p.seed);
    }
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation="source-over";
    var url=this.canvas.toDataURL();
    this.img.style.maskImage="url("+url+")";
    this.img.style.webkitMaskImage="url("+url+")";
    this.img.style.maskSize="100% 100%";
    this.img.style.webkitMaskSize="100% 100%";
    this.img.style.maskRepeat="no-repeat";
    this.img.style.webkitMaskRepeat="no-repeat";
  };

  var stage=document.getElementById("stage");
  var flower=document.getElementById("flower");
  var bgLayer=document.getElementById("flowerBg");
  var topLayer=document.getElementById("flowerTop");

  var bgTrail=new MorphTrailLayer(bgLayer,false);
  var topTrail=new MorphTrailLayer(topLayer,true);

  var points=[];
  var lastSample=null;
  var headRadius=0;
  var hovering=false;
  var mouseX=0,mouseY=0;
  var time=0;
  var flowerRect={w:0,h:0};

  function syncSize(){
    var r=flower.getBoundingClientRect();
    flowerRect.w=r.width;
    flowerRect.h=r.height;
    bgTrail.resize(r.width,r.height);
    topTrail.resize(r.width,r.height);
  }
  syncSize();
  window.addEventListener("resize",syncSize);

  function toFlowerSpace(clientX,clientY){
    var r=flower.getBoundingClientRect();
    var scaleX=flowerRect.w? (r.width/flowerRect.w):1;
    var scaleY=flowerRect.h? (r.height/flowerRect.h):1;
    return {
      x:(clientX-r.left)*(flowerRect.w? (bgTrail.canvas.width/r.width):1),
      y:(clientY-r.top)*(flowerRect.h? (bgTrail.canvas.height/r.height):1)
    };
  }

  stage.addEventListener("mousemove",function(e){
    hovering=true;
    var p=toFlowerSpace(e.clientX,e.clientY);
    mouseX=p.x;mouseY=p.y;
  });
  stage.addEventListener("mouseenter",function(){hovering=true;});
  stage.addEventListener("mouseleave",function(){hovering=false;});

  function tick(){
    var targetR=hovering?TRAIL_HEAD_R:0;
    headRadius+=(targetR-headRadius)*(hovering?0.14:0.04);

    if(hovering&&headRadius>5){
      if(!lastSample||Math.hypot(mouseX-lastSample.x,mouseY-lastSample.y)>TRAIL_SAMPLE_DIST){
        points.push({x:mouseX,y:mouseY,r:headRadius,alpha:1,seed:Math.random()*100});
        lastSample={x:mouseX,y:mouseY};
        if(points.length>TRAIL_MAX_POINTS)points.shift();
      }
    }

    for(var i=points.length-1;i>=0;i--){
      points[i].alpha*=TRAIL_FADE_SPEED;
      points[i].r*=0.995;
      if(points[i].alpha<0.01)points.splice(i,1);
    }

    time+=0.016;

    if(points.length){
      bgTrail.render(points,time);
      topTrail.render(points,time);
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
